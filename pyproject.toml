[project]
name = "checker"
version = "0.1.0"
description = "Incremental submission similarity checker for screenshot-heavy PDFs"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "pillow",
    "numpy>=2",
    "opencv-python-headless",
    "imagehash",
    "rapidocr-onnxruntime",
    # GPU builds of onnxruntime by platform, so `uv run` uses the GPU by default (falls back to the CPU at run time).
    # DirectML covers NVIDIA, AMD and Intel GPUs on Windows; CUDA covers NVIDIA on Linux. macOS keeps the CPU build.
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime-gpu[cuda,cudnn]; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pytesseract",
    "scikit-learn",
    "rapidfuzz",
    "ftfy",
    "pygments",
    "dateparser",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "sqlalchemy>=2",
    "pydantic-settings",
    "watchdog",
    "networkx",
]

[tool.uv]
# rapidocr asks for plain `onnxruntime`, which would clash with the GPU builds above (same Python module).
override-dependencies = ["onnxruntime; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')"]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
